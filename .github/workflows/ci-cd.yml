name: CI/CD demo
on:
    push:
        branches: [ main, dev]
    pull_request:
        branches: [ main, dev]
defaults:
    run:
        shell: powershell
jobs:
    test:
        name: Run Tests
        runs-on: self-hosted
    
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Verify Python version
              run: |
                python3 --version
                (Get-Command python3).Source
            - name: Install dependencies
              run: |
                python3 -m venv .venv
                .venv\Scripts\python.exe -m pip install -r requirements.txt
            - name: Run tests
              run: |
                .venv\Scripts\python.exe -m pytest test_app.py -v
    build:
        name: Build Docker Image
        runs-on: self-hosted
        needs: test

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            
            - name: Build Docker Image
              run: docker build -t ci-cd-demo:latest .
    deploy:
        name: Deploy to localhost
        runs-on: self-hosted
        needs: build
        if: github.ref == 'refs/heads/main'

        steps:
            - name: stop old container
              run: |
                 if (docker ps -aq --filter "name=^python-app$") { docker rm -f python-app }
            - name: start new container
              run: |
                 docker run -d --name python-app -p 5001:5001 --restart unless-stopped ci-cd-demo:latest
            - name: check deployment
              run: |
                Start-Sleep -Seconds 10
                curl.exe --fail http://localhost:5001/health
                if ($LASTEXITCODE -ne 0) { exit 1 }
                Write-Output "Deployment successful"
            - name: show running containers
              run: docker ps --filter "name=python-app"